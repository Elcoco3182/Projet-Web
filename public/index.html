<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer NOT Tank Game</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="popup" id="popup">
    <div class="popup-content">
      <h2>Welcome to the NOT Tank Game</h2>
      <sub>Created by Filippo, Dhruvi and Corentin and NOT Josh Caponigro</sub>
      <br>
      <img src="/assets/images/Lapipizza2.png" width="480" height="320" alt="quoi?"/>

      <p>Use the arrow keys to move your NON tank.</p>
      <form id="joueurTypeForm">
        <label for="joueurType">Player type</label>
        <select id="joueurType">
          <!-- Envoyé par ws depuis client.js et la db roles-->
        </select>
        <button type="submit">Start Game</button>
      </form>
    </div>
  </div>
  <div class ="stats-bar" id ="dayTime">
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script src="client.js"></script>
</body>

</html>
