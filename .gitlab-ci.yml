stages:
  - lint
  - test
  - build
  - deploy

variables:
  DENO_VERSION: "2.5.0"
  IMAGE_BASE: $CI_REGISTRY_IMAGE

# ── Image Deno réutilisée par lint et test ─────────────────────────────────
.deno:
  image: denoland/deno:alpine-$DENO_VERSION

# ── Stage 1 : Lint ─────────────────────────────────────────────────────────
lint:
  extends: .deno
  stage: lint
  script:
    - deno fmt --check
    - deno lint

# ── Stage 2 : Tests ────────────────────────────────────────────────────────
test:
  extends: .deno
  stage: test
  script:
    - deno test --allow-env tests/

# ── Stage 3 : Build & push images ─────────────────────────────────────────
# Seulement sur main, après lint + test.
.build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-back:
  extends: .build-image
  script:
    - docker build -f docker/back/Dockerfile -t $IMAGE_BASE/back:$CI_COMMIT_SHORT_SHA -t $IMAGE_BASE/back:latest .
    - docker push $IMAGE_BASE/back:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_BASE/back:latest

build-api:
  extends: .build-image
  script:
    - docker build -f docker/api/Dockerfile -t $IMAGE_BASE/api:$CI_COMMIT_SHORT_SHA -t $IMAGE_BASE/api:latest .
    - docker push $IMAGE_BASE/api:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_BASE/api:latest

build-front:
  extends: .build-image
  script:
    - docker build -f docker/front/Dockerfile -t $IMAGE_BASE/front:$CI_COMMIT_SHORT_SHA -t $IMAGE_BASE/front:latest .
    - docker push $IMAGE_BASE/front:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_BASE/front:latest

build-db:
  extends: .build-image
  script:
    - docker build -f docker/db/Dockerfile -t $IMAGE_BASE/db:$CI_COMMIT_SHORT_SHA -t $IMAGE_BASE/db:latest .
    - docker push $IMAGE_BASE/db:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_BASE/db:latest

# ── Stage 4 : Deploy sur la vm de corentin (moi) ()─────────────────────────────────────────

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan $VM_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $VM_USER@$VM_HOST "
      cd ~/mon-projet &&
      docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD &&
      docker compose pull &&
      docker compose up -d
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - build-back
    - build-api
    - build-front
    - build-db
