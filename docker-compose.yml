services:


  front:
    build:
      context: .
      dockerfile: ./docker/front/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./public:/app/public
    env_file:
      - .env
    depends_on:
      back :
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontNetwork

  back:
    build:
      context: .
      dockerfile: ./docker/back/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./server.ts:/app/server.ts
    env_file:
      - .env
    environment:
      - DENO_DIR=/tmp/deno-cache
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    depends_on:
      api :
        condition: service_healthy
    healthcheck:
      test: ["CMD", "deno", "eval", "await fetch('http://localhost:3000/health').then(r => r.ok ? Deno.exit(0) : Deno.exit(1)).catch(() => Deno.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - frontNetwork
      - middleNetwork

  api:
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "deno", "eval", "await fetch('http://localhost:8000/health').then(r => r.ok ? Deno.exit(0) : Deno.exit(1)).catch(() => Deno.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - middleNetwork
      - backNetwork

  db:
    build:
      context: .
      dockerfile: ./docker/db/Dockerfile
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backNetwork

volumes:
  pg_data:

networks:
  frontNetwork:
    driver: bridge
  middleNetwork:
    driver: bridge
    internal: true
  backNetwork:
    driver: bridge
    internal: true