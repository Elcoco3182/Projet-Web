services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://user:password@db:5432/mydb
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app          # Hot-reload en dev
    restart: unless-stopped
    networks:
      - backNetwork
      - frontNetwork

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"     # Optionnel : accès local à la DB
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backNetwork

volumes:
  postgres_data:

networks:
  backNetwork :
      driver: bridge
      internal: true
  frontNetwork :
      driver: bridge